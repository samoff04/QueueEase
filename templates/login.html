<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Login • QueueEase Pro</title>
<link rel="stylesheet" href="{{ url_for('static',filename='style.css') }}">
</head>
<body>

<div class="auth-page">

<div class="auth-card">

<div class="brand">
<h1>QueueEase</h1>
<p>Smart Appointment & Queue Platform</p>
</div>

{% with messages=get_flashed_messages(with_categories=true) %}
{% if messages %}
{% for category,message in messages %}
<div class="alert {{ category }}">
{{ message }}
</div>
{% endfor %}
{% endif %}
{% endwith %}

<form method="POST" class="auth-form">

<input
type="text"
name="username"
placeholder="Username"
required>

<input
type="password"
name="password"
placeholder="Password"
required>

<button
type="submit"
class="primary-btn">
Login
</button>

</form>

<div class="auth-switch">
<p>New to QueueEase?</p>
<a href="/register">Create account</a>
</div>

</div>

</div>

</body>
</html>
